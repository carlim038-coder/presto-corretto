    <!-- Sezione Principale Chi Siamo -->
    <main class="container my-5 pt-5">
      <h1 class="text-yellow text-center my-4 fw-bold">Chi Siamo</h1>
      
      <section class="container-fluid vh-75">
        <div class="row align-items-center justify-content-center h-100">
          
          <!-- Colonna con il cerchio centrale e i cerchi dinamici dei docenti -->
          <div class="col-12 col-md-6 d-flex justify-content-center align-items-center position-relative" style="min-height: 400px;">
            <div class="circle">
              <div class="opener">
                <i class="fa-solid fa-plus text-yellow"></i>

            </div>
          </div>

          <!-- Colonna con la Flip Card / Informazioni del docente -->
          <div class="col-12 col-md-6 text-center d-flex justify-content-center align-items-center">
            <div class="flip-card">
              <!-- Eventuale contenuto della card descrittiva -->
              <h3 id="cardName" class="text-yellow">Il nostro Team</h3>
              <p id="cardDescription" class="text-white">Clicca sul pulsante centrale e seleziona un docente per scoprire di più.</p>
            </div>
          </div>

        </div>
      </section>
