    <!-- Sezione Contatti -->
    <main class="container my-5 pt-5">
      <h1 class="text-yellow text-center my-4 fw-bold">Contattaci</h1>
      
      <div class="row justify-content-center">
        <div class="col-12 col-md-8">
          <form class="p-4 border border-yellow rounded bg-black">
            <div class="mb-3">
              <label for="name" class="form-label text-yellow">Nome e Cognome</label>
              <input type="text" class="form-control" id="name" placeholder="Inserisci il tuo nome">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label text-yellow">Indirizzo Email</label>
              <input type="email5" class="form-control" id="email" placeholder="nome@esempio.com">
            </div>
            <div class="mb-3">
              <label for="message" class="form-label text-yellow">Messaggio</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Scrivi qui il tuo messaggio..."></textarea>
            </div>
            <button type="submit" class="btn btn-warning fw-bold w-100">Invia Messaggio</button>
          </form>
        </div>
      </div>
    </main>
